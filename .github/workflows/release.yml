name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build linux/${{ matrix.arch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          bundle="wgswp_${version}_linux_${GOARCH}"

          mkdir -p "dist/${bundle}/web"
          CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/${bundle}/wgswp" ./cmd/server
          cp -a web/public "dist/${bundle}/web/public"

          tar -czf "dist/${bundle}.tar.gz" -C dist "${bundle}"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: wgswp-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd dist
          sha256sum wgswp_*_linux_*.tar.gz | sort -k2 > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz \
            dist/sha256sums.txt
